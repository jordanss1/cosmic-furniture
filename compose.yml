services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: nextjs-image
    container_name: nextjs-container
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - db
    develop:
      watch:
        - path: ./package.json
          action: rebuild
        - path: ./package-lock.json
          action: rebuild

        - path: ./next.config.js
          action: rebuild

        - path: .
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env
            - .env.*
            - package.json
            - package-lock.json
            - Dockerfile
            - compose.yml
            - compose.yaml
            - "**/*.log"

  db:
    image: mysql:8
    container_name: db
    environment:
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    restart: always
    volumes:
      - db_data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/my.cnf
    ports:
      - "12345:3306"
    env_file:
      - ./.env

  media-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: cosmic-media-nginx:latest
    container_name: cosmic-media
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - media_data:/content:ro

volumes:
  db_data:
  media_data:
